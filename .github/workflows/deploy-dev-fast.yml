name: Deploy DEV fast

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

concurrency:
  group: auraly-dev-fast
  cancel-in-progress: false

jobs:
  recover-platform-admin:
    name: Recover DEV platform administrator
    runs-on: ubuntu-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Build database package
        shell: pwsh
        run: dotnet build database/Auraly.Database/Auraly.Database.sqlproj --configuration Release

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Apply DEV administrator recovery
        shell: pwsh
        env:
          AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${{ secrets.AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH }}
        run: |
          $ErrorActionPreference = 'Stop'
          if ([string]::IsNullOrWhiteSpace($env:AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH)) { throw 'AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH is unavailable.' }
          dotnet tool install --global Microsoft.SqlPackage --version 170.4.83
          $rule = "github-admin-recovery-$([guid]::NewGuid().ToString('N').Substring(0,8))"
          try {
            $ip = (Invoke-RestMethod -Uri 'https://api.ipify.org').Trim()
            az sql server firewall-rule create --resource-group RG-AURALY-DEV --server sql-auraly-dev-w5usmo6w --name $rule --start-ip-address $ip --end-ip-address $ip --output none
            $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
            & "$HOME/.dotnet/tools/sqlpackage" /Action:Publish /SourceFile:database/Auraly.Database/bin/Release/Auraly.Database.dacpac /TargetServerName:tcp:sql-auraly-dev-w5usmo6w.database.windows.net,1433 /TargetDatabaseName:auraly-dev /AccessToken:$token /v:DeploymentEnvironment=dev /v:BootstrapAdminPasswordHash="$($env:AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH)" /p:BlockOnPossibleDataLoss=True /p:DropObjectsNotInSource=False /p:CommandTimeout=120 /TargetTimeout:60
            if ($LASTEXITCODE) { throw 'Database deployment failed.' }
          } finally {
            az sql server firewall-rule delete --resource-group RG-AURALY-DEV --server sql-auraly-dev-w5usmo6w --name $rule --output none 2>$null
          }

  api:
    if: ${{ false }}
    name: Deploy API directly to DEV
    runs-on: windows-latest
    environment: dev
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Publish API
        shell: pwsh
        run: |
          dotnet restore Auraly.Commerce.sln --locked-mode
          if ($LASTEXITCODE) { throw 'Restore failed.' }
          dotnet build database/Auraly.Database/Auraly.Database.sqlproj --configuration Release --no-restore
          if ($LASTEXITCODE) { throw 'Database build failed.' }
          dotnet publish src/API/Auraly.Api/Auraly.Api.csproj --configuration Release --no-restore --output artifacts/api
          if ($LASTEXITCODE) { throw 'API publish failed.' }
          Compress-Archive -Path artifacts/api/* -DestinationPath artifacts/auraly-api-dev.zip -Force

      - name: Login to Azure with OIDC
        uses: azure/login@v2
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}

      - name: Install SQLPackage 170
        shell: pwsh
        run: dotnet tool install --global Microsoft.SqlPackage --version 170.4.83

      - name: Deploy tenant fiscal schema to DEV
        shell: pwsh
        env:
          AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH: ${{ secrets.AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH }}
        run: |
          $ErrorActionPreference = 'Stop'
          $rule = "github-fast-$([guid]::NewGuid().ToString('N').Substring(0,10))"
          try {
            $ip = (Invoke-RestMethod -Uri 'https://api.ipify.org').Trim()
            az sql server firewall-rule create --resource-group RG-AURALY-DEV --server sql-auraly-dev-w5usmo6w --name $rule --start-ip-address $ip --end-ip-address $ip --output none
            if ($LASTEXITCODE) { throw 'Could not create the temporary SQL firewall rule.' }
            $token = az account get-access-token --resource https://database.windows.net/ --query accessToken -o tsv
            if ($LASTEXITCODE -or [string]::IsNullOrWhiteSpace($token)) { throw 'Azure SQL access token is unavailable.' }

            $connection = [System.Data.SqlClient.SqlConnection]::new(
              'Server=tcp:sql-auraly-dev-w5usmo6w.database.windows.net,1433;Initial Catalog=auraly-dev;Encrypt=True;TrustServerCertificate=False;Connection Timeout=60;')
            $connection.AccessToken = $token
            try {
              $connection.Open()
              $command = $connection.CreateCommand()
              $command.CommandTimeout = 120
              $command.CommandText = Get-Content database/Auraly.Database/Scripts/Migrations/20260824_MoveFiscalCredentialsToTenant.sql -Raw
              [void]$command.ExecuteNonQuery()
            } finally {
              $connection.Dispose()
            }

            if ([string]::IsNullOrWhiteSpace($env:AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH)) { throw 'AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH is unavailable.' }
            & "$HOME\.dotnet\tools\sqlpackage.exe" /Action:Publish /SourceFile:database/Auraly.Database/bin/Release/Auraly.Database.dacpac /TargetServerName:tcp:sql-auraly-dev-w5usmo6w.database.windows.net,1433 /TargetDatabaseName:auraly-dev /AccessToken:$token /v:DeploymentEnvironment=dev /v:BootstrapAdminPasswordHash="$($env:AURALY_BOOTSTRAP_ADMIN_PASSWORD_HASH)" /p:BlockOnPossibleDataLoss=True /p:DropObjectsNotInSource=False /p:CommandTimeout=120 /TargetTimeout:60
            if ($LASTEXITCODE) { throw 'Database deployment failed.' }
          } finally {
            az sql server firewall-rule delete --resource-group RG-AURALY-DEV --server sql-auraly-dev-w5usmo6w --name $rule --output none 2>$null
          }

      - name: Ensure Web Push credentials
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $settings = az webapp config appsettings list `
            --resource-group RG-AURALY-DEV `
            --name api-auraly-dev-w5usmo6w `
            --query "[?name=='Notifications__WebPush__PublicKey' || name=='Notifications__WebPush__PrivateKey']" `
            --output json | ConvertFrom-Json
          if ($LASTEXITCODE) { throw 'Could not inspect Web Push configuration.' }
          if (@($settings).Count -lt 2 -or @($settings | Where-Object { [string]::IsNullOrWhiteSpace($_.value) }).Count -gt 0) {
            function ConvertTo-Base64Url([byte[]]$bytes) {
              return [Convert]::ToBase64String($bytes).TrimEnd('=').Replace('+','-').Replace('/','_')
            }
            $key = [Security.Cryptography.ECDsa]::Create([Security.Cryptography.ECCurve]::NamedCurves.nistP256)
            try {
              $parameters = $key.ExportParameters($true)
              [byte[]]$publicBytes = @(4) + $parameters.Q.X + $parameters.Q.Y
              $publicKey = ConvertTo-Base64Url $publicBytes
              $privateKey = ConvertTo-Base64Url $parameters.D
              az webapp config appsettings set `
                --resource-group RG-AURALY-DEV `
                --name api-auraly-dev-w5usmo6w `
                --settings `
                  "Notifications__WebPush__PublicKey=$publicKey" `
                  "Notifications__WebPush__PrivateKey=$privateKey" `
                  "Notifications__WebPush__Subject=mailto:soporte@auraly.app" `
                --output none
              if ($LASTEXITCODE) { throw 'Could not configure Web Push.' }
            } finally {
              $key.Dispose()
            }
          }

      - name: Deploy API without release version
        shell: pwsh
        run: |
          az webapp deploy --resource-group RG-AURALY-DEV --name api-auraly-dev-w5usmo6w --src-path artifacts/auraly-api-dev.zip --type zip --restart true --clean true --async true --track-status false --output none
          if ($LASTEXITCODE) { throw 'Direct API deployment failed.' }

          $health = 'https://api-auraly-dev-w5usmo6w.azurewebsites.net/health'
          for ($attempt = 1; $attempt -le 18; $attempt++) {
            try {
              $response = Invoke-WebRequest -Uri $health -TimeoutSec 15
              if ($response.StatusCode -eq 200) {
                $functional = Invoke-WebRequest `
                  -Uri 'https://api-auraly-dev-w5usmo6w.azurewebsites.net/api/v1/auth/me' `
                  -SkipHttpErrorCheck -TimeoutSec 15
                if ($functional.StatusCode -eq 401) {
                  Write-Host $response.Content
                  Write-Host 'Functional middleware probe returned the expected 401.'
                  exit 0
                }
              }
            } catch {
              Write-Host "API startup attempt $attempt/18: $($_.Exception.Message)"
            }
            Start-Sleep -Seconds 10
          }

          az webapp log startup show --resource-group RG-AURALY-DEV --name api-auraly-dev-w5usmo6w 2>&1 | Write-Host
          throw 'API did not become healthy after direct deployment.'
